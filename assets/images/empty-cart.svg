<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none" aria-label="NYRVA LIFE Empty Shopping Cart Illustration">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF8E8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C768" />
      <stop offset="50%" stop-color="#C8A02E" />
      <stop offset="100%" stop-color="#9E781B" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A2D" />
      <stop offset="100%" stop-color="#143D14" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#143D14" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Ambient Botanical Background Circle -->
  <circle cx="120" cy="120" r="92" fill="#FDF8E8" stroke="#E6DAB8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Grounding Shadow -->
  <ellipse cx="120" cy="190" rx="68" ry="10" fill="#143D14" fill-opacity="0.08" />

  <!-- Botanical Sprout Behind Bag (Left) -->
  <path d="M78 128 C64 105, 72 75, 96 68 C94 88, 86 112, 78 128 Z" fill="url(#leafGrad)" opacity="0.85" />
  <path d="M86 100 C74 95, 62 104, 58 116 C68 118, 80 110, 86 100 Z" fill="#2D7A2D" opacity="0.75" />

  <!-- Botanical Sprout Behind Bag (Right) -->
  <path d="M162 128 C176 105, 168 75, 144 68 C146 88, 154 112, 162 128 Z" fill="url(#leafGrad)" opacity="0.85" />
  <path d="M154 100 C166 95, 178 104, 182 116 C172 118, 160 110, 154 100 Z" fill="#2D7A2D" opacity="0.75" />

  <!-- Luxury Shopping Bag Body -->
  <g filter="url(#softShadow)">
    <!-- Bag Main Face -->
    <path d="M68 96 L80 180 C81 184, 84 186, 88 186 L152 186 C156 186, 159 184, 160 180 L172 96 C173 91, 169 88, 164 88 L76 88 C71 88, 67 91, 68 96 Z" fill="url(#bagGrad)" stroke="#C8A02E" stroke-width="2.5" />

    <!-- Bag Top Fold / Border -->
    <path d="M72 88 L168 88 L166 100 L74 100 Z" fill="#F7EED3" stroke="#C8A02E" stroke-width="1.5" />

    <!-- Bag Handles (Gold Ribbon) -->
    <path d="M96 88 C96 56, 144 56, 144 88" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M96 88 C96 60, 144 60, 144 88" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Handle Fasteners (Metallic Rivets) -->
    <circle cx="96" cy="98" r="4" fill="url(#goldGrad)" stroke="#143D14" stroke-width="0.8" />
    <circle cx="144" cy="98" r="4" fill="url(#goldGrad)" stroke="#143D14" stroke-width="0.8" />

    <!-- Center Emblem: Botanical Leaf & Gold Border -->
    <circle cx="120" cy="142" r="22" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.8" />
    <!-- Stylized Herbal Leaf Emblem inside Bag -->
    <path d="M120 128 C110 134, 110 148, 120 156 C130 148, 130 134, 120 128 Z" fill="url(#leafGrad)" />
    <path d="M120 132 L120 154" stroke="#C8A02E" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Small Floating Golden Stars / Sparkles -->
  <path d="M60 76 Q60 82 54 82 Q60 82 60 88 Q60 82 66 82 Q60 82 60 76 Z" fill="url(#goldGrad)" />
  <path d="M184 76 Q184 82 178 82 Q184 82 184 88 Q184 82 190 82 Q184 82 184 76 Z" fill="url(#goldGrad)" />
  <circle cx="120" cy="42" r="2.5" fill="#C8A02E" />
</svg>
